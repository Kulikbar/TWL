  // RIESLING
  {id:"611",cat:"Riesling",type:"white",producer:"Bründlmayer",name:"Heiligenstein 1ÖTW 'Lyra' Reserve",region:"Kamptal, Austria",vintage:"2015",abv:"13%",price:150,cert:"PR",icons:["⚖️","🍋","🧂"],notes:["White peach","Apricot","Beeswax","Lime zest","Volcanic mineral"],tableside:"A decade-old Riesling from the Heiligenstein — Austria's most celebrated Riesling site, grown on volcanic basalt. The 2015 has developed the deep, honeyed complexity that marks great aged Riesling — beeswax, dried wildflowers, ripe stone fruit, and a finish that won't quit.",pairings:["Aged mountain cheeses","Roasted pork","Grilled trout","Mushroom-based dishes"],story:"The Heiligenstein is a volcanic basalt anomaly in Kamptal — a dark, heat-retaining rock formation surrounded by the region's typical primary rock and loess. The dark soils absorb heat during the day and release it slowly at night, extending the ripening season in a way no other site in the region can replicate. Bründlmayer's 'Lyra' designation refers to the unusual vine training system used — a wide, lyre-shaped canopy that increases sun exposure while reducing yields. This 2015 is now in its prime: the aged complexity has arrived — beeswax, dried wildflowers, concentrated stone fruit — and the volcanic mineral quality runs through every sip.",trivia:["The complex, waxy, dried-wildflower character that develops in aged Riesling comes from a compound called TDN (trimethyl-dihydronaphthalene). Wine professionals sometimes call it 'petrol' — a term worth knowing but not worth using at a table. Tell guests it's the signature of age in great Riesling.","The Lyra training system was developed in Bordeaux in the 1980s — Bründlmayer adopted it for the Heiligenstein to control the volcanic soil's natural exuberance.","The Heiligenstein has been a recognized quality site since the 18th century — one of the few Austrian vineyards with a documented historical reputation predating the modern classification system."]},
  {id:"649",cat:"Riesling",type:"white",producer:"Bründlmayer",name:"Heiligenstein 1ÖTW 'Lyra' Reserve",region:"Kamptal, Austria",vintage:"2021",abv:"13%",price:253,cert:"PR",icons:["⚖️","🍋","🧂"],notes:["Lime","Green peach","Volcanic stone","Citrus blossom","Tight mineral finish"],tableside:"The younger vintage of Bründlmayer's Heiligenstein flagship — same volcanic site, but 2021 is wound tighter and needs time. For guests who want to taste where great Austrian Riesling is going, not where it's been.",pairings:["Oysters","Sashimi","River fish","Delicate white meat"],story:"This is the same wine as the 2015 — same vineyard, same producer, same meticulous farming — but caught much earlier in its life. The 2021 vintage was cool and precise in Kamptal, producing Rieslings with high acidity and a taut, almost severe mineral quality that needs years to integrate. If the 2015 is the arrival, the 2021 is the departure.",trivia:["2021 was one of the coolest growing seasons in Kamptal in recent memory — the wines are built for the long term, not for immediate pleasure.","Bründlmayer ages their reserve Rieslings in large neutral oak casks — a traditional approach that adds subtle texture without oak flavors.","The Heiligenstein's volcanic basalt is geologically unrelated to the surrounding rock — believed to be the remnant of ancient volcanic activity millions of years old."]},
  {id:"643",cat:"Riesling",type:"white",producer:"Hiedler",name:"Ried Heiligenstein 1ÖTW",region:"Kamptal, Austria",vintage:"2022",abv:"13%",price:134,cert:"",icons:["⚖️","🍋","🧂"],notes:["Grapefruit","Lime leaf","Wet stone","White peach","Long dry finish"],tableside:"A second producer on the Heiligenstein — Hiedler's interpretation is a little more approachable than Bründlmayer's, slightly earlier-drinking, but with the same unmistakable volcanic mineral backbone the site always delivers.",pairings:["Grilled river fish","Shellfish","Veal with citrus sauce","Light vegetable preparations"],story:"The Heiligenstein is farmed by multiple producers — Bründlmayer, Hiedler, Hirsch, and Schloss Gobelsburg among the most notable. Comparing their wines is one of the great exercises in understanding how the same site expresses itself differently through different hands. Hiedler's style tends toward earlier accessibility and slightly more generous fruit than Bründlmayer's more austere approach.",trivia:["The Heiligenstein is officially classified 1ÖTW — premier cru — but was recognized as exceptional long before the modern system existed.","Hiedler has farmed Kamptal since the 1980s — young by Austrian standards but quickly established as a serious producer.","Having multiple quality producers on the same vineyard is relatively unusual in Austria — the Heiligenstein is one of the few sites where the comparison is genuinely instructive."]},
  {id:"645",cat:"Riesling",type:"white",producer:"Hirsch",name:"Ried Zobinger Heiligenstein 1ÖTW DAC",region:"Kamptal, Austria",vintage:"2022",abv:"13%",price:186,cert:"",icons:["⚖️","🍋","🧂"],notes:["Stone fruit","Smoke","Citrus zest","Volcanic mineral","Precise long finish"],tableside:"Hirsch is the most biodynamically serious producer on the Heiligenstein — and it shows. There's a depth and precision here that reflects not just the volcanic terroir but a winemaker who has spent decades understanding exactly what this site wants to say.",pairings:["Steamed fish","Light game birds","Aged hard cheeses","Clean vegetable preparations"],story:"Johannes Hirsch converted his estate to biodynamic farming before it was fashionable and has been refining his approach for decades. His Heiligenstein is widely considered one of the benchmark expressions of the site: not the most immediately generous, but the most site-true. The volcanic character is stark and uncompromising.",trivia:["Johannes Hirsch converted to biodynamic farming in the early 2000s and has since become one of Austria's most vocal advocates for the practice.","The Zobinger Heiligenstein designation specifies the Heiligenstein parcels within the village of Zöbing — further geographic precision within an already specific site.","Hirsch's wines are consistently cited in international blind tastings as among the most distinctive expressions of Austrian Riesling."]},
  {id:"639",cat:"Riesling",type:"white",producer:"Schloss Gobelsburg",name:"Heiligenstein 1ÖTW, Zöbing",region:"Kamptal, Austria",vintage:"2015",abv:"13%",price:140,cert:"CS",icons:["⚖️","🍋","🧂"],notes:["Apricot","Honeyed complexity beginning","Lime","Spice","Mineral backbone"],tableside:"A decade-old Gobelsburg Heiligenstein in a beautiful drinking window right now: the honeyed, waxy complexity of age is arriving, the fruit is still vivid, and the mineral structure from the volcanic soils frames the whole thing. For guests who want to experience aged Austrian Riesling without waiting.",pairings:["Roasted pork belly","Aged Comté","Grilled trout","Duck confit"],story:"Schloss Gobelsburg holds multiple vintages of their Heiligenstein, and the 2015 is the one ready to drink right now. Their interpretation tends toward more richness and generosity than Hirsch's more austere style — same volcanic rock, but centuries of estate tradition bring a rounder, more integrated character.",trivia:["Certified Sustainable (CS) means the estate has met third-party verified standards for water use, biodiversity, and energy management.","2015 was a warm vintage in Kamptal — the wines have aged more quickly than cool vintages and are drinking at their peak now.","Schloss Gobelsburg's sustainability certification was awarded by the Austrian wine association."]},
  {id:"613",cat:"Riesling",type:"white",producer:"Schloss Gobelsburg",name:"Heiligenstein 1ÖTW",region:"Kamptal, Austria",vintage:"2019",abv:"13%",price:187,cert:"",icons:["⚖️","🍋","🧂"],notes:["White peach","Grapefruit","Smoke","Wet stone","Long mineral finish"],tableside:"The 2019 Gobelsburg Heiligenstein — less evolved than the 2015, more energetic, the volcanic mineral front and center. A wine that's just starting to open up. For guests who want to taste potential.",pairings:["Shellfish","Steamed white fish","Light poultry","Herb-forward preparations"],story:"2019 was a warm vintage in Kamptal, but the Heiligenstein's volcanic soils and elevation kept the acidity alive. The Gobelsburg Heiligenstein at this stage shows the volcanic mineral quality most clearly — before the beeswax and dried-flower complexity of age softens it. It rewards undivided attention.",trivia:["The 2019 vintage was one of the warmest on record — but the Heiligenstein's volcanic soils and elevation moderated temperatures where flat sites couldn't.","Schloss Gobelsburg holds back multiple vintages of Heiligenstein simultaneously — giving the ability to show guests the wine's evolution across a decade.","Gobelsburg's approach to Riesling is deliberately lower-intervention than their Grüner Veltliner program."]},
  {id:"623",cat:"Riesling",type:"white",producer:"Schloss Gobelsburg",name:"Heiligenstein 1ÖTW",region:"Kamptal, Austria",vintage:"2021",abv:"13%",price:183,cert:"",icons:["⚖️","🍋","🧂"],notes:["Lime zest","Citrus blossom","Chalk","Stone fruit","Precise dry finish"],tableside:"The youngest of three Gobelsburg Heiligensteins on the list — 2021, tight and precise. The volcanic mineral is already evident but the wine is still gathering itself. Three vintages of the same wine on one list: the 2021 is all tension, the 2019 is opening up, the 2015 is at its peak.",pairings:["Oysters","Raw shellfish","Delicate white fish","Light starters"],story:"Having three vintages of the same Gobelsburg Heiligenstein on the list is a live demonstration of what bottle age does to Riesling. Walking a curious guest through all three is one of the most instructive tasting experiences available.",trivia:["Three vintages of the same wine in one list is unusual — most restaurants turn over inventory too quickly to offer this kind of vertical.","Vertical tastings — same wine, multiple vintages — are considered one of the most educational formats in fine wine.","The cool 2021 vintage is expected to age more slowly than the warm 2019 — they may be at similar development in 10 years despite the two-year gap."]},
  {id:"641",cat:"Riesling",type:"white",producer:"Nigl",name:"Trocken, Senftenberger Pellingen Privat",region:"Kremstal, Austria",vintage:"2015",abv:"13%",price:135,cert:"Co/b",icons:["⚖️","🍋","🧂"],notes:["Lime","Beeswax","Apricot","Smoked stone","Long focused finish"],tableside:"A decade-old biodynamic Riesling from Nigl — one of Kremstal's most celebrated estates. The beeswax and dried wildflower complexity is in full development, the stone fruit is concentrated, and the acidity is still very much alive. One of the great aged Austrian Rieslings on the list.",pairings:["Aged hard cheeses","Roast pork","Smoked fish","Mushroom dishes"],story:"Martin Nigl is widely considered one of Austria's finest Riesling producers — his biodynamic estate in Kremstal produces wines of extraordinary precision. The Senftenberger Pellingen is his top Riesling site: a steep, rocky slope where yields are naturally low and concentration is high. At a decade, this is showing everything that makes serious Austrian Riesling so compelling.",trivia:["Nigl holds Demeter certification — the same certification used for the most rigorous biodynamic wines worldwide.","The Senftenberger Pellingen is classified in Nigl's range as 'Privat' — his designation for his top single-vineyard expressions.","Kremstal, which borders Kamptal to the east along the Krems River, produces Rieslings generally considered slightly riper and more accessible than Kamptal expressions."]},
  {id:"637",cat:"Riesling",type:"white",producer:"Nigl",name:"Trocken, Hochäcker",region:"Kremstal, Austria",vintage:"2015",abv:"13%",price:125,cert:"Co/b",icons:["⚖️","🍋","🧂"],notes:["Lime zest","Dried wildflowers","Mineral","Citrus peel","Clean long finish"],tableside:"A more accessible aged Nigl Riesling — the Hochäcker is a step below the Pellingen in concentration but still a decade-old biodynamic Kremstal from one of Austria's best producers. A great entry point for guests curious about Nigl without committing to the top tier.",pairings:["Grilled fish","Pork dishes","Soft cheeses","Vegetable preparations"],story:"Nigl makes Rieslings at multiple quality levels — the Hochäcker shares the same biodynamic farming and winemaker as the Privat Pellingen. It's the kind of wine that makes you understand why Austrian wine enthusiasts talk about Nigl the way Burgundy lovers talk about their favorite domains: every level of the range is worth drinking.",trivia:["The name Hochäcker translates roughly as 'high fields' — referring to the elevated position above the Krems Valley floor.","Biodynamic farming prohibits all synthetic inputs and adds homeopathic preparations developed by philosopher Rudolf Steiner in the 1920s.","Nigl's wines consistently appear in international best-of-Austrian-Riesling lists."]},
  {id:"653",cat:"Riesling",type:"white",producer:"Alzinger",name:"Trocken, Ried Höhereck Smaragd",region:"Wachau, Austria",vintage:"2022",abv:"13.5%",price:163,cert:"",icons:["💪","🍋","🧂"],notes:["Ripe peach","Apricot","Granite","Lime zest","Vinous long finish"],tableside:"Smaragd — the Wachau's top ripeness classification. Alzinger is one of the Wachau's most celebrated estates. Big, structured, age-worthy Austrian Riesling from a region that treats the grape with the same seriousness as Burgundy treats Pinot Noir.",pairings:["Roasted pork","Veal","Cream sauces","Aged hard cheeses"],story:"The Wachau is Austria's most dramatic wine landscape — steep granite terraces carved by the Danube gorge, where vines have been planted since the Romans. Alzinger is a small family estate that quietly produces some of the region's finest wines. The Smaragd classification — named after the emerald-green lizard that sunbathes on the terrace walls — indicates the ripest, most age-worthy style.",trivia:["The Smaragd classification is named after the Emerald Lizard (Lacerta viridis) that lives on the warm stone terrace walls of Wachau vineyards.","The Wachau's terraced vineyards are among the steepest in the world — some slopes exceed 45 degrees, making all work manual.","Alzinger consistently wins top ratings from international critics while maintaining a deliberately low profile."]},
  {id:"625",cat:"Riesling",type:"white",producer:"Alzinger",name:"Trocken, Ried Loibenberg Smaragd",region:"Wachau, Austria",vintage:"2022",abv:"13.5%",price:163,cert:"",icons:["💪","🍋","🧂"],notes:["Ripe stone fruit","Orange zest","Granite","Spice","Rich textured finish"],tableside:"A second Alzinger Smaragd — the Loibenberg faces south, is slightly warmer, and produces Rieslings with more richness and spice than the Höhereck. For guests who want to understand how different aspects within the same village produce different wines.",pairings:["Roasted fish","Pork belly","Duck","Rich mushroom dishes"],story:"The Loibenberg faces directly south — unusual in Wachau where most premium sites face east or northeast. This gives it a level of ripeness that neighboring vineyards can't match. Comparing the Höhereck and Loibenberg is a masterclass in how aspect shapes wine character even within the same appellation.",trivia:["Loiben has been continuously inhabited for over 7,000 years — one of the oldest settlements in the Wachau.","South-facing slopes in the Wachau receive significantly more solar radiation than north-facing slopes.","Alzinger farms the Loibenberg biodynamically."]},
  {id:"653c",cat:"Riesling",type:"white",producer:"Alzinger",name:"Trocken, Ried Steinertal Smaragd",region:"Wachau, Austria",vintage:"2023",abv:"13.5%",price:183,cert:"",icons:["💪","🍋","🧂"],notes:["Peach","Grapefruit","Volcanic mineral","Spice","Long dry finish"],tableside:"Alzinger's third Smaragd — the Steinertal, their most mineral and site-expressive vineyard. The 2023 is young, showing the freshness of a new Smaragd. This needs time, but the foundation is extraordinary.",pairings:["Grilled lobster","Rich white fish","Pork with fruit","Complex vegetable dishes"],story:"The Steinertal is Alzinger's most distinctive site — a steep, rocky parcel with volcanic influences giving a smoky, flinty mineral quality different from their granite-driven sites. Three Alzinger Smaragds on the same list is a rare opportunity: the Höhereck, Loibenberg, and Steinertal represent three different aspects and soil types within the same small estate.",trivia:["The Steinertal is the steepest and most difficult to farm of Alzinger's main sites.","2023 was a warm, early vintage in the Wachau — the wines have more immediate richness than the cooler 2022.","Alzinger releases Smaragd wines only after extended cellar aging."]},
  {id:"619",cat:"Riesling",type:"white",producer:"F.X. Pichler",name:"Trocken, Ried Klostersatz",region:"Wachau, Austria",vintage:"2023",abv:"13.5%",price:137,cert:"Co/b",icons:["💪","🍋","🧂"],notes:["White peach","Lime","Granite mineral","Almond blossom","Precise long finish"],tableside:"F.X. Pichler is the most famous name in the Wachau — their wines have set the benchmark for the region for decades. The Klostersatz is their most accessible Smaragd: full Wachau power and precision, a little earlier-drinking. Biodynamic farming adds purity.",pairings:["Grilled fish","Light veal","White asparagus","Delicate shellfish"],story:"Lucas Pichler took over from his legendary father F.X. in 2012 and has maintained the estate's position at the very top of Austrian wine. The Klostersatz sits on primary rock below the monastery walls of Dürnstein — 'Klostersatz' means 'monastery seat.' The biodynamic certification, achieved recently, has added a further dimension of purity.",trivia:["F.X. Pichler — Franz Xaver Pichler — is widely considered the greatest living Austrian winemaker of his generation.","The monastery in Klostersatz is the Augustinian monastery of Dürnstein — established in the 12th century, its ruins dominate the hillside above the vineyard.","Lucas Pichler converted the estate to biodynamic farming gradually between 2015 and 2020."]},
  {id:"603",cat:"Riesling",type:"white",producer:"Nikolaihof",name:"Trocken, Jungfernlese Steiner Hund",region:"Wachau, Austria",vintage:"2005",abv:"13%",price:275,cert:"Co/b",icons:["💪","🧂","🌸"],notes:["Honey","Dried apricot","Beeswax","Beeswax","Astonishing mineral length"],tableside:"A 20-year-old biodynamic Riesling from the Wachau's oldest estate. This is not a wine for sipping — it's a wine for paying attention. The beeswax and dried-wildflower complexity is deep, the fruit concentrated and dried, and the mineral backbone from the Steiner Hund is still running clean through the whole thing.",pairings:["Aged hard cheeses","Foie gras","Rich pâté","Honey-glazed poultry"],story:"Nikolaihof is Austria's oldest winery — built on Roman foundations in the first century AD — and the first estate in the world to receive Demeter biodynamic certification, in 1971. The Saahs family farms with an almost philosophical commitment to the land: no chemicals of any kind for over 50 years, and wines released only when the family believes they're ready. The 2005 Steiner Hund at 20 years is still alive, complex, and nowhere near finished.",trivia:["Nikolaihof was built on the site of a Roman military outpost — archaeological excavations have found wine vessels dating to the first century AD.","The estate received Demeter biodynamic certification in 1971 — before biodynamic farming was known outside a small circle of Austrian agriculture specialists.","The Steiner Hund ('Stone Dog') vineyard is classified grand cru equivalent by the Vinea Wachau."]},
  {id:"621",cat:"Riesling",type:"white",producer:"Nikolaihof",name:"Trocken, Klause am Berg Privat",region:"Wachau, Austria",vintage:"2012",abv:"13%",price:300,cert:"Co/b",icons:["💪","🧂","🌸"],notes:["Dried stone fruit","Beeswax","Honey","Smoked mineral","Extraordinary length"],tableside:"Thirteen years old and still unfolding — Nikolaihof's Privat designation means this is the estate's top expression, made only in exceptional years. The 2012 vintage's warmth adds a glycerous richness that makes this unforgettable. One of the most profound wines on the list.",pairings:["Foie gras","Aged Parmigiano","Truffle-based dishes","Glazed poultry"],story:"Nikolaihof releases 'Privat' wines only when they believe a specific vintage and site combination merits it. 2012 was a warm, exceptional vintage in the Wachau. The Saahs family maintains a strict no-compromise policy: wines are only released when they're ready, regardless of market pressure. At 13 years, this is one of the most complex wines on the list.",trivia:["The Privat designation carries enormous weight among Austrian wine enthusiasts — it has no legal definition but is self-imposed with absolute seriousness.","The Saahs family has resisted every acquisition offer — they consider the estate an ongoing philosophical project.","2012 in the Wachau produced some of the most celebrated wines of the decade."]},
  {id:"635",cat:"Riesling",type:"white",producer:"Nikolaihof",name:"Trocken, Steiner Hund",region:"Wachau, Austria",vintage:"2015",abv:"13%",price:160,cert:"Co/b",icons:["💪","🍋","🧂"],notes:["Peach","Beeswax and dried wildflowers arriving","Citrus","Honey beginning","Volcanic mineral"],tableside:"The Steiner Hund at ten years — the Nikolaihof mineral signature is fully present and the beeswax and aged complexity is just arriving. A wine at the beginning of something great. Compare it to the 2005 if you want to understand what awaits.",pairings:["Rich fish","Aged cheeses","Roasted pork","Complex vegetable preparations"],story:"Having the Steiner Hund in both 2005 and 2015 on the list is an extraordinary opportunity — ten years apart, same site, same biodynamic farming, completely different phases of development. The 2005 shows the destination; the 2015 shows the journey.",trivia:["The Steiner Hund has been farmed continuously for over 1,200 years — its history is documented in monastic records from the 9th century.","Nikolaihof prunes by hand using tools that have barely changed in centuries.","The Wachau's Vinea Wachau association, which administers the Smaragd classification system, was established in 1983."]},
  {id:"615",cat:"Riesling",type:"white",producer:"Nikolaihof",name:"Trocken 'Vinotek' Im Weingebirge Smaragd",region:"Wachau, Austria",vintage:"1997",abv:"13%",price:320,cert:"Co/b",icons:["💪","🧂","🌸"],notes:["Deep honey","Dried apricot","Beeswax","Beeswax","Extraordinary mineral persistence"],tableside:"A 28-year-old biodynamic Riesling. Very few wines remain alive and compelling at this age — this is one of them. The Vinotek designation means it was released from Nikolaihof's own library. This is a once-in-a-career pour for most guests.",pairings:["Aged hard cheeses","Foie gras","Truffles","On its own"],story:"The Vinotek series is Nikolaihof's library release program — wines held back for extended aging, released only when the family believes they've reached a peak of expressiveness. The 1997 Im Weingebirge at 28 years is showing what biodynamic winemaking in the Wachau can achieve: deeply complex, honeyed, mineral, and still technically alive in a way that defies expectation.",trivia:["1997 was a warm, early vintage — initially considered good but not exceptional. 28 years of bottle aging has proved that assessment spectacularly wrong.","The Im Weingebirge ('In the wine mountains') is a historic Wachau designation that predates the modern classification system.","Nikolaihof's cellar maintains a constant 12°C year-round — naturally, without refrigeration."]},
  {id:"617",cat:"Riesling",type:"white",producer:"Nikolaihof",name:"Trocken 'Vinotek' Im Weingebirge Smaragd",region:"Wachau, Austria",vintage:"2002",abv:"13%",price:420,cert:"Co/b",icons:["💪","🧂","🌸"],notes:["Honey","Beeswax","Deep beeswax","Dried fig","Transcendent mineral finish"],tableside:"Twenty-three years old and the most expensive bottle in the Riesling section. The 2002 Vinotek is Nikolaihof at their most profound. If a guest asks what to pair it with, the honest answer is: their full attention.",pairings:["Nothing, or everything","Aged cheeses","Truffles","Foie gras"],story:"2002 is considered one of the greatest Riesling vintages of the modern era in both Austria and Germany. The Nikolaihof 2002, held in their Vinotek library for over two decades, has become something that requires no food pairing, no context, and no explanation. It is one of the most profound wines we offer.",trivia:["2002 is widely considered alongside 1999, 2007, and 2015 as one of the four great Riesling vintages of the last quarter century.","The Vinotek aging program depends entirely on the natural cellar temperature — no technology, no manipulation, just stone walls and patience.","At $420, this is the most expensive white wine on the list. For Riesling of this age and provenance, it is also arguably the best value."]},
  {id:"601",cat:"Riesling",type:"white",producer:"Prager",name:"Trocken, Ried Klaus Smaragd",region:"Wachau, Austria",vintage:"2017",abv:"13.5%",price:126,cert:"PR",icons:["💪","🍋","🧂"],notes:["White peach","Apricot","Granite","Lime","Structured long finish"],tableside:"Prager is one of the Wachau's foundational estates — making serious Smaragd before the classification existed. The Ried Klaus is their most approachable top vineyard: full Wachau power and mineral, but a little earlier-drinking. The 2017 is beautiful right now.",pairings:["Rich fish","Roasted white meats","Mushroom dishes","Cream sauces"],story:"Toni and Ilse Bodenstein — Prager by inheritance — built one of the Wachau's great estates over decades of meticulous farming. The Ried Klaus is a granite-dominated site producing Rieslings with the combination of power, richness, and mineral backbone that defines the best Wachau Smaragd.",trivia:["Prager was one of the founding members of the Vinea Wachau association in 1983 — the organization that created the Smaragd classification system.","The Klaus vineyard name appears in monastic records from the 14th century.","Toni Bodenstein is widely credited with helping establish the Wachau's international reputation in the 1980s."]},
  {id:"607",cat:"Riesling",type:"white",producer:"Anton Bauer",name:"Feuersbrunn",region:"Wagram, Austria",vintage:"2021",abv:"13%",price:50,cert:"",icons:["☁️","🍋","🌸"],notes:["Lime","Green apple","Light mineral","Citrus blossom","Crisp clean finish"],tableside:"The most approachable Riesling on the list — Anton Bauer's entry-level Wagram expression. Lighter, less complex than the Wachau or Kamptal bottles, but fresh, precise, and well-made at a price that makes it an easy recommendation.",pairings:["Oysters","Light fish","Salads","Aperitif"],story:"Anton Bauer is a Wagram estate that consistently over-delivers at its price point. Wagram — the plateau region north of Vienna — is less celebrated than Kamptal or Wachau, but produces wines with genuine character from its distinctive loess and sand soils.",trivia:["Wagram is named after the Battle of Wagram (1809), where Napoleon defeated the Austrian Empire.","Loess soils in Wagram are found in some of the deepest deposits in Austria, up to 20 meters thick in some areas.","Anton Bauer is one of the most prominent advocates for the Wagram appellation internationally."]},

  // SAUVIGNON BLANC
  {id:"330",cat:"Sauvignon Blanc",type:"white",producer:"Strauss",name:"Ried Gamlitzberg, Südsteiermark",region:"Styria, Austria",vintage:"2022",abv:"13%",price:55,cert:"",icons:["☁️","🍋","🌿"],notes:["Grapefruit","Cut grass","Gooseberry","White currant","Clean herbal finish"],tableside:"Styrian Sauvignon Blanc — the Austrian version of this grape most people don't know exists. Where New Zealand is tropical and the Loire is flinty, Styrian Sauvignon is herbaceous, precise, and intensely mineral. This Gamlitzberg is the entry point: approachable, aromatic, built for food.",pairings:["Goat cheese","Grilled asparagus","Shellfish","Light herb-forward dishes"],story:"Südsteiermark — South Styria — is Austria's southernmost wine region, tucked against the Slovenian border in a landscape of rolling hills. The Sauvignon Blanc grown here is dramatically different from both the Loire and New Zealand styles: more herbal than tropical, more mineral than fruity. Strauss is a reliable, quality-focused producer in the Gamlitz area, the heart of Styrian Sauvignon.",trivia:["Südsteiermark is geographically closer to Zagreb than to Vienna — a border region with both Austrian and Slovenian cultural heritage.","The rolling hills of Styria are covered almost entirely in vines — one of the most visually dramatic wine regions in Central Europe.","Sauvignon Blanc was brought to Styria in the 19th century by Archduke Johann of Austria."]},
  {id:"309",cat:"Sauvignon Blanc",type:"white",producer:"Strauss/Tscherne",name:"'18,' Südsteiermark DAC",region:"Styria, Austria",vintage:"2024",abv:"13%",price:40,cert:"",icons:["☁️","🍋","🌿"],notes:["Lime","Green herbs","Citrus zest","Gooseberry","Bright dry finish"],tableside:"The most affordable Sauvignon Blanc on the list — a joint project between two Styrian producers, made for immediate pleasure. The right answer when someone wants a glass of something clean, bright, and not expensive.",pairings:["Aperitif","Salads","Light fish","Fresh goat cheese"],story:"'18' is a collaborative cuvée between producers Strauss and Tscherne, both based in the Gamlitz area. The name refers to the collaboration number. The 2024 is the freshest wine in the Sauvignon section: primary, aromatic, built for drinking now.",trivia:["Collaborative cuvées between independent producers are relatively uncommon in Austria.","Südsteiermark DAC requires wines to be made from Sauvignon Blanc or Welschriesling.","The 2024 vintage in Styria was warm and abundant — wines with generous fruit and early accessibility."]},
  {id:"317",cat:"Sauvignon Blanc",type:"white",producer:"Tement",name:"Ried Zieregg, Südsteiermark",region:"Styria, Austria",vintage:"2018",abv:"14%",price:140,cert:"Co/b",icons:["💪","🧂","🌿"],notes:["White peach","Grapefruit pith","Smoked herb","Limestone mineral","Long textured finish"],tableside:"The Zieregg is Tement's grand cru — and arguably Austria's most celebrated Sauvignon Blanc vineyard. The 2018 is now at six years and showing the development that makes this one of the most serious expressions of the grape anywhere in the world. Nothing like New Zealand. Nothing like the Loire. Entirely its own thing.",pairings:["Raw oysters","Grilled fish","Aged goat cheese","Complex vegetable preparations"],story:"Manfred Tement is one of Austria's most celebrated winemakers, and the Zieregg is his crown jewel — a single south-facing slope above Gamlitz producing Sauvignon Blanc of extraordinary intensity and mineral depth. At 14% alcohol and six years of age, this is a completely different wine from what most people think of when they think Sauvignon Blanc.",trivia:["The Zieregg is consistently ranked among the top five Sauvignon Blanc vineyards in the world.","Tement converted the Zieregg to biodynamic farming in the early 2000s.","The Zieregg faces directly south — unusual in Styria where most premium sites have east or southeast exposure."]},
  {id:"323",cat:"Sauvignon Blanc",type:"white",producer:"Tement",name:"Ried Zieregg, Südsteiermark",region:"Styria, Austria",vintage:"2020",abv:"14%",price:177,cert:"Co/b",icons:["💪","🧂","🌿"],notes:["Grapefruit","Smoked stone","White peach","Herb","Monumental mineral finish"],tableside:"The 2020 Zieregg — two years younger than the 2018, slightly more wound up, built on a cooler vintage's higher acidity. If the 2018 is Zieregg at its most generous, this is Zieregg at its most precise.",pairings:["Oysters","Delicate fish","Aged goat cheese","Herb-forward preparations"],story:"The 2020 vintage in Styria was cooler and more precise than 2018, giving the Zieregg a different character: tighter, more mineral-driven, built for longer aging. Comparing the 2018 and 2020 Zieregg side by side is one of the most instructive tastings on the list.",trivia:["2020 was significantly cooler than 2018 in Styria — the wines have a tighter, more nervous energy.","Tement holds back significant quantities of each Zieregg vintage for library release.","The Zieregg appeared in Jancis Robinson's list of the world's 100 greatest vineyards."]},
  {id:"333",cat:"Sauvignon Blanc",type:"white",producer:"Tement",name:"Ried Grassnitzberg, Südsteiermark",region:"Styria, Austria",vintage:"2018",abv:"13.5%",price:116,cert:"Co/b",icons:["⚖️","🧂","🌿"],notes:["Citrus blossom","Herb","Grapefruit","Limestone","Clean mineral finish"],tableside:"The Grassnitzberg is Tement's second great single-vineyard Sauvignon — less concentrated than the Zieregg, more elegant, earlier-drinking. The 2018 is in a beautiful place right now: mature, open, showing the Tement house style at its most accessible.",pairings:["Grilled fish","Goat cheese","Shellfish","Herb-crusted chicken"],story:"The Grassnitzberg faces southeast rather than south — a subtle difference in exposure that produces a lighter, more aromatic style. Same biodynamic farming as the Zieregg; what differs is purely the site. The right recommendation when a guest wants the Tement quality but isn't ready for the Zieregg's weight.",trivia:["The Grassnitzberg has been farmed by the Tement family for three generations.","Southeast exposure gives longer morning sun and less intense afternoon heat compared to true south-facing sites.","Tement also produces wines from the Slovenian side of the border — one of the few genuinely cross-border wine estates in Europe."]},
  {id:"305",cat:"Sauvignon Blanc",type:"white",producer:"Tement",name:"Ried Grassnitzberg, Südsteiermark",region:"Styria, Austria",vintage:"2019",abv:"13.5%",price:95,cert:"Co/b",icons:["⚖️","🧂","🌿"],notes:["Grapefruit","Green herb","Citrus","Mineral","Dry precise finish"],tableside:"The 2019 Grassnitzberg — a year younger than the 2018, slightly more energetic, showing the same Tement precision with a bit more grip. The most affordable Tement single-vineyard wine on the list.",pairings:["Oysters","Grilled fish","Asparagus","Goat cheese"],story:"Having both the 2018 and 2019 Grassnitzberg on the list gives the same comparative opportunity as the Zieregg — same site, different vintage character. The 2019 was warm and precise in Styria, producing Sauvignon Blancs with more body than the 2018 but excellent sustained acidity.",trivia:["The 2019 vintage was one of the warmest in Styrian history — but the Grassnitzberg's southeast exposure and elevation helped retain freshness.","Tement exports primarily to Germany, Switzerland, Austria, and the United States.","The Tement family converted to biodynamic certification for both the Zieregg and Grassnitzberg simultaneously."]},
  {id:"321",cat:"Sauvignon Blanc",type:"white",producer:"Blackbird Vineyards",name:"'Dissonance,' Napa Valley",region:"Napa Valley, California",vintage:"2020",abv:"14%",price:45,cert:"",icons:["⚖️","🧈","🌸","🍑"],notes:["Melon","White peach","Vanilla","Guava","Creamy texture"],tableside:"California-style Sauvignon Blanc — barrel-fermented, rich, and tropical. This is Sauvignon Blanc for guests who usually drink Chardonnay. Smooth, generous, no sharp edges.",pairings:["Lobster","Crab","Rich fish preparations","Soft cheeses"],story:"Blackbird Vineyards is a Napa estate better known for their red Bordeaux blends, but the Dissonance has built its own following among guests who want something white but richer than most Sauvignon Blanc delivers. Barrel fermentation adds the creamy, vanilla texture; Napa fruit brings the tropical richness.",trivia:["Sauvignon Blanc barrel fermentation fundamentally changes the wine's character, adding weight and texture while suppressing herbal aromatics.","Blackbird Vineyards was founded in 2003 specifically to make Bordeaux-variety wines.","Napa Valley's warm climate produces Sauvignon Blanc with tropical fruit dominance."]},
  {id:"335",cat:"Sauvignon Blanc",type:"white",producer:"Cloisonné",name:"Russian River Valley",region:"Sonoma County, California",vintage:"2022",abv:"13.5%",price:54,cert:"",icons:["⚖️","🌿","🍋"],notes:["Grapefruit","Passionfruit","Lemon grass","Cut grass","Clean fresh finish"],tableside:"A cooler-climate California Sauvignon Blanc from Russian River — more herbal and precise than Napa Sauvignon, closer to the Loire in spirit. A good middle ground for guests who want California freshness without the tropical richness of a warmer-climate bottle.",pairings:["Shellfish","Light fish","Goat cheese","Salads"],story:"Russian River Valley is one of California's coolest growing regions — morning fog from the Pacific keeps temperatures low and ripening slow, producing wines with higher acidity and more herbal character. Cloisonné is a small-production project focused on this style of Sauvignon Blanc.",trivia:["Russian River Valley's morning fog is caused by the Petaluma Wind Gap — a natural gap in the coastal mountains.","The region is far better known for Pinot Noir and Chardonnay than Sauvignon Blanc.","Russian River Valley received its own AVA designation in 1983."]},
  {id:"329",cat:"Sauvignon Blanc",type:"white",producer:"Peju",name:"Napa Valley",region:"Napa Valley, California",vintage:"2022",abv:"14%",price:49,cert:"",icons:["⚖️","🌸","🍋","🍑"],notes:["Citrus blossom","White peach","Light herb","Melon","Smooth finish"],tableside:"Peju is one of Napa's most guest-friendly estates — their Sauvignon Blanc is approachable, floral, and easy to recommend to anyone who wants something white, crisp, and California without being heavy.",pairings:["Aperitif","Light fish","Mild cheeses","Salads"],story:"Peju Province Winery was founded by Tony and Herta Peju in 1982 and remains family-owned — a rarity in Napa Valley. Their Sauvignon Blanc is made in a clean, un-oaked style that emphasizes the grape's natural freshness.",trivia:["Peju Province is one of the few Napa Valley estates still fully family-owned after four decades.","The 'Province' in the name refers to Tony Peju's Provençal French heritage.","Napa Valley's Sauvignon Blanc is typically harvested in August — one of the earliest harvests in the valley calendar."]},
  {id:"334",cat:"Sauvignon Blanc",type:"white",producer:"Quintessa",name:"'Illumination,' North Coast",region:"North Coast, California",vintage:"2024",abv:"14%",price:72,cert:"",icons:["⚖️","🌸","🍋","🍑"],notes:["White peach","Citrus blossom","Light herb","Melon","Rounded finish"],tableside:"Illumination is the second label of Quintessa — one of Napa's most prestigious estates. All the quality and care of the Quintessa approach, applied to Sauvignon Blanc. A step up from most California Sauvignon in terms of depth and texture.",pairings:["Crab","Lobster","Rich fish","Brie"],story:"Quintessa is the creation of Valeria and Augustin Huneeus — Chilean wine royalty who built one of Napa's most organically farmed estates. Illumination is sourced from the cooler North Coast AVA, giving it more freshness than a straight Napa Sauvignon.",trivia:["Quintessa is one of Napa's most philosophically committed organic producers.","Illumination includes Sauvignon Musqué — a more aromatic clone that adds floral lift.","The North Coast AVA is one of California's broadest designations, encompassing Napa, Sonoma, and several cooler coastal appellations."]},
  {id:"117",cat:"Sauvignon Blanc",type:"white",producer:"Château de Cruzeau",name:"Bordeaux Blanc",region:"Pessac-Léognan, Bordeaux",vintage:"2020",abv:"13%",price:63,cert:"",icons:["⚖️","🌿","🌸"],notes:["Grapefruit","White peach","Herb","Chalk","Clean long finish"],tableside:"White Bordeaux — Sauvignon Blanc as the French do it in the left bank. Drier and more mineral than California, more textured than Sancerre, with a Sémillon component that adds body and breadth. A useful wine for guests who think they don't like Sauvignon Blanc.",pairings:["Grilled fish","Shellfish","Chicken with herb sauce","Goat cheese"],story:"White Bordeaux is made from Sauvignon Blanc blended with Sémillon — the Sauvignon provides freshness and aromatics; the Sémillon adds body, texture, and longevity. Château de Cruzeau is a Pessac-Léognan estate whose white consistently over-delivers.",trivia:["Pessac-Léognan is the only Bordeaux appellation that classifies both its red and white wines.","Sémillon develops honey, beeswax, and lanolin complexity with age — completely unlike any other white grape.","White Bordeaux is one of the most undervalued wine categories in the world."]},
  {id:"118",cat:"Sauvignon Blanc",type:"white",producer:"Château La Louvière",name:"Bordeaux Blanc",region:"Pessac-Léognan, Bordeaux",vintage:"2018",abv:"13%",price:84,cert:"",icons:["⚖️","🧈","🌿"],notes:["White peach","Herb","Light toast","Waxy texture","Mineral"],tableside:"La Louvière is a classified Pessac-Léognan estate — their white is aged in oak, giving it a toasty, textured character closer to white Burgundy than anything New World. A wine for guests who take their whites seriously.",pairings:["Turbot","Scallops","Veal","Aged cheeses"],story:"The blend at La Louvière is approximately 85% Sauvignon Blanc and 15% Sémillon — a ratio that emphasizes freshness while the Sémillon adds the characteristic waxy texture. The 2018 vintage in Bordeaux was warm and generous, producing whites with unusual richness and depth.",trivia:["Château La Louvière is classified as a historical monument — the 18th century château itself is considered architecturally significant.","André Lurton is credited with reviving Pessac-Léognan's white wine reputation in the 1960s and 70s.","Sémillon's characteristic waxy texture is unique among white grapes — nothing else tastes quite like it."]},
  {id:"331",cat:"Sauvignon Blanc",type:"white",producer:"Henri Bourgeois",name:"Pouilly-Fumé, Loire Valley",region:"Loire Valley, France",vintage:"2023",abv:"13%",price:70,cert:"",icons:["☁️","🍋","🧂"],notes:["Flint","Grapefruit","White currant","Chalk","Smoky mineral finish"],tableside:"Classic Pouilly-Fumé from one of the Loire's most respected estates. The 'fumé' — smoky — in the name comes from the gunflint soils, and you can taste it: Sauvignon Blanc at its most mineral and precise.",pairings:["Oysters","Grilled fish","Chèvre","Clean shellfish preparations"],story:"Henri Bourgeois is a multi-generational Loire family that farms both in Sancerre and Pouilly-Fumé — the two great Sauvignon Blanc appellations on opposite banks of the Loire River. Pouilly-Fumé tends toward more immediate accessibility and a more pronounced smoky, flinty mineral quality from the region's famous silex (flint) soils.",trivia:["The 'Fumé' in Pouilly-Fumé refers to the smoke-like character of the wine, which comes from the silex (flint) soils rather than any winemaking technique.","Pouilly-Fumé and Sancerre face each other across the Loire River — only a few kilometers apart but with different soil compositions.","Henri Bourgeois also makes wines in Marlborough, New Zealand under the Clos Henri label."]},
  {id:"337",cat:"Sauvignon Blanc",type:"white",producer:"Lauverjat",name:"Sancerre, Loire Valley",region:"Loire Valley, France",vintage:"2025",abv:"13%",price:69,cert:"",icons:["☁️","🍋","🧂"],notes:["Lime","White currant","Chalk","Citrus blossom","Precise mineral finish"],tableside:"Sancerre — the world's most famous Sauvignon Blanc appellation. Lauverjat is a reliable, quality-focused producer, and the 2025 is the freshest vintage on the list: all primary citrus, chalk mineral, and the clean precision that made Sancerre famous.",pairings:["Raw oysters","Goat cheese","Grilled fish","Light vegetable preparations"],story:"Sancerre sits on the eastern Loire where the hills rise sharply from the floodplain. The soils here — primarily Kimmeridgian limestone and silex — produce Sauvignon Blanc with a precision and mineral clarity that no other region can replicate.",trivia:["Sancerre has been made famous in part by its association with Crottin de Chavignol — the aged goat cheese from the village of Chavignol within the appellation. One of the great French regional food-and-wine pairings.","The 2025 vintage is the most recent on the entire list — these wines were harvested barely months before landing on the table.","Sancerre's reputation was built almost entirely in the second half of the 20th century."]},
  {id:"327",cat:"Sauvignon Blanc",type:"white",producer:"Tement",name:"'Fosilni Berg,' Ciringa",region:"Ciringa, Slovenia",vintage:"2021",abv:"13.5%",price:48,cert:"",icons:["☁️","🌿","🧂"],notes:["Lime","Herb","Light mineral","Citrus zest","Clean dry finish"],tableside:"Tement's Slovenian expression — their vineyards cross the border and this comes from the Slovenian side. Same biodynamic farming, same producer, completely different appellation. A remarkable value for a Tement wine and a great conversation piece.",pairings:["Light fish","Goat cheese","Salads","Aperitif"],story:"Tement's vineyards don't stop at the Austrian border — the Ciringa appellation in Slovenia sits directly adjacent to their Südsteiermark parcels, and Manfred Tement farms both sides with the same biodynamic approach. The Fosilni Berg ('Fossil Hill') is named after the marine fossils in the limestone soils. At $48, it's the most affordable Tement wine on the list.",trivia:["The Austrian-Slovenian wine border is one of the most unusual in the world — the same producer can hold certified organic vineyards in two countries.","Ciringa sits in the Brda region, home to some of Slovenia's most celebrated producers.","The fossilized marine sediments in Ciringa's soils date from when the area was covered by the ancient Tethys Sea."]},
  {id:"H1",cat:"Sauvignon Blanc",type:"white",producer:"Tement",name:"'Pruh,' Ciringa",region:"Ciringa, Slovenia",vintage:"2018",abv:"14%",price:117,cert:"",icons:["⚖️","🧂","🌿"],notes:["Stone fruit","Herbs","Limestone mineral","Smoked","Long textured finish"],tableside:"Tement's top Slovenian bottling — the Pruh is to Ciringa what the Zieregg is to Südsteiermark. Six years of age, biodynamic farming, and the same meticulous approach that defines everything Tement makes.",pairings:["Rich fish","Aged goat cheese","Grilled white meats","Complex vegetable dishes"],story:"The Pruh is Tement's premier cru expression from their Slovenian parcels — a single-vineyard wine from the best site on the Ciringa side. At six years, it's showing the same development that makes the Grassnitzberg and Zieregg so compelling.",trivia:["'Pruh' means 'stripe' in Slovenian — referring to the distinctive bands of limestone and marl in the vineyard's soil profile.","Manfred Tement is one of very few winemakers considered a reference point for the same grape variety in two different countries simultaneously.","The Brda region of Slovenia was part of the Austro-Hungarian Empire until 1918, then Italian territory until 1947."]},
  {id:"319",cat:"Sauvignon Blanc",type:"white",producer:"Elena Walch",name:"Alto Adige",region:"Alto Adige, Italy",vintage:"2023",abv:"13%",price:59,cert:"",icons:["☁️","🍋","🌸"],notes:["Grapefruit","Passionfruit","White peach","Citrus blossom","Crisp clean finish"],tableside:"Alto Adige Sauvignon Blanc — Italian in address, Austrian in soul. Elena Walch is one of the region's most celebrated producers: aromatic, precise, with the altitude-driven freshness that makes Alto Adige wines so distinctive.",pairings:["Aperitif","Shellfish","Light fish","Fresh cheeses"],story:"Elena Walch is a remarkable story: a Vienna-born architect who married into one of Alto Adige's great wine families and transformed the estate into one of the region's leading producers. Alto Adige sits in the northern Italian Alps, where vineyards at 300 to 900 meters produce whites with an Alpine freshness that no warmer Italian region can match.",trivia:["Alto Adige is Italy's most Germanic wine region — German is an official language and the wine culture reflects both Italian and Austrian influences.","Each 100 meters of altitude reduces average temperature by approximately 0.6°C — giving winemakers extraordinary flexibility.","The region was part of the Austro-Hungarian Empire until 1919."]},

  // ROSÉ
  {id:"381",cat:"Rosé",type:"rosé",producer:"Argyle",name:"Willamette Valley Rosé, 2022",region:"Willamette Valley, Oregon",vintage:"2022",abv:"13%",price:42,cert:"",icons:["☁️","🍋","🌸"],notes:["Raspberry","Watermelon","Citrus","Light herb","Dry crisp finish"],tableside:"Oregon Pinot Noir rosé — light, precise, dry. Argyle is one of Willamette Valley's most reliable producers and this is exactly what you want rosé to be: nothing heavy, nothing sweet, just clean red-fruit freshness with the kind of acidity that makes you reach for another glass.",pairings:["Grilled fish","Light salads","Goat cheese","Summer starters"],story:"Argyle was founded in 1987 with an explicit focus on sparkling wine and cool-climate varieties. Their still rosé program emerged from the same philosophy: Pinot Noir grown in cool Willamette conditions, harvested early, handled gently. The 2022 vintage was warm and generous in Oregon, producing rosés with slightly more body than cooler years while retaining the acidity that defines Willamette wine.",trivia:["Argyle was one of the first Oregon wineries to focus specifically on traditional method sparkling wine.","Willamette Valley rosé is almost exclusively made from Pinot Noir — giving it a different character from Provençal rosés made from Grenache and Mourvèdre.","Oregon's wine country sits between the Coast Range and the Cascades — the two ranges create a rain shadow producing a drier, sunnier growing season than Pacific Coast averages would suggest."]},
  {id:"383",cat:"Rosé",type:"rosé",producer:"Clementine Carter",name:"Rosé of Grenache, Santa Barbara County, 2022",region:"Santa Barbara County, California",vintage:"2022",abv:"13%",price:98,cert:"",icons:["⚖️","🌸","🧂"],notes:["Strawberry","Watermelon","Herbs de Provence","White pepper","Dry mineral finish"],tableside:"Clementine Carter makes some of the most thoughtful wines in Santa Barbara — small production, site-specific. This Grenache rosé is closer to Bandol than anything from Provence: more structured, more mineral, with a savory herb quality that makes it genuinely food-versatile.",pairings:["Grilled fish","Lamb chops","Ratatouille","Soft ripened cheeses"],story:"Clementine Carter is a winemaker working across small vineyards in Santa Barbara County — she sources from some of the best sites in the region. The Grenache rosé comes from old-vine material in a warm, rocky vineyard that produces the kind of concentrated, mineral-driven Grenache you find in southern France.",trivia:["Grenache is the most planted red grape in the world by volume — the foundation of Châteauneuf-du-Pape, Priorat, and many of Spain's most celebrated wines.","Bandol, in Provence, is considered the gold standard for serious dry rosé — made primarily from Mourvèdre, it can age for decades.","Santa Barbara County's east-west mountain orientation is unique in California — it allows cold Pacific air to penetrate directly inland, creating some of the coolest growing conditions in the state."]},
  {id:"385",cat:"Rosé",type:"rosé",producer:"Morgante",name:"Rosé of Nero d'Avola, Sicily, 2021",region:"Sicily, Italy",vintage:"2021",abv:"13%",price:44,cert:"",icons:["⚖️","🌸","🌿"],notes:["Pomegranate","Dried cherry","Mediterranean herbs","Orange zest","Dry savory finish"],tableside:"Sicilian rosé from Nero d'Avola — the island's signature red grape. Not the pale, delicate Provence style: this is bolder, more Mediterranean, with a sun-baked savory quality that makes it feel like a trip to Agrigento. Interesting and different at a very easy price.",pairings:["Grilled octopus","Arancini","Caponata","Grilled fish"],story:"Morgante is a family estate in Agrigento province, in Sicily's hot, arid interior. Nero d'Avola in rosé form translates those dark fruit and Mediterranean herb qualities into something savory and slightly rustic in the best possible way: a wine that tastes like the food it was made to accompany.",trivia:["Nero d'Avola — 'black grape of Avola' — is named after the town of Avola in Syracuse province. It's been grown on the island for at least 2,000 years.","Sicily historically sold most of its production in bulk to northern Italian and French producers — a practice that has largely ended as the island built its own reputation.","The volcanic soils around Mount Etna have attracted enormous international investment — but Morgante's inland Agrigento region represents a more traditional face of Sicilian wine."]},
  {id:"HILL-SECCO",cat:"Other Bubbles",type:"sparkling",producer:"Hillinger",name:"Secco Pinot Noir Rosé, NV",region:"Burgenland, Austria",vintage:"NV",abv:"11.5%",price:56,cert:"PR",icons:["☁️","🌸","🍑"],notes:["Strawberry","Raspberry","Light cream","Rose petal","Refreshing dry finish"],tableside:"Hillinger's Secco is the lightest, most approachable sparkling on the list — lightly fizzy, strawberry-forward, bone dry. Made the same way as Prosecco but from Austrian Pinot Noir. The right pour when someone wants something pink, festive, and effortless.",pairings:["Aperitif","Charcuterie","Light starters","Strawberry desserts"],story:"Secco is the Austrian term for lightly sparkling wines made by the tank method — CO2 is introduced after fermentation rather than through a secondary fermentation in bottle, producing a softer, more immediately approachable fizz than traditional method sparkling. Hillinger farms organically in Burgenland and this is their most casual, crowd-friendly bottle: a rosé fizz built entirely for pleasure. The Pinot Noir brings genuine red fruit rather than the neutral base you'd find in a lot of light sparkling rosés.",trivia:["The tank method — also called the Charmat method — was developed by Frédéric Charmat in France in 1907 and is the same process used for Prosecco. It preserves fresh, primary fruit flavors better than traditional method but produces softer, less persistent bubbles.","Hillinger's organic certification means no synthetic pesticides, herbicides, or fertilizers — unusual for a producer at this price and volume level.","Burgenland's warm Pannonian climate makes it one of Austria's most reliable regions for ripe, fruit-forward wines — the same warmth that produces great Blaufränkisch reds gives this rosé its generous strawberry character."]},
  {id:"MITT-ROSE",cat:"Rosé",type:"rosé",producer:"Tegernseerhof",name:"Zweigelt Rosé, 2024",region:"Wachau, Austria",vintage:"2024",abv:"12.5%",price:56,cert:"CS",icons:["☁️","🌸","🍋"],notes:["Cherry","Red currant","Watermelon","Fresh herbs","Bright dry finish"],tableside:"A Wachau rosé from the Mittelbach family — six generations farming the same stone terraces that produce some of Austria's greatest Riesling and Grüner. Made from Zweigelt, Austria's signature red grape. Bright, dry, and genuinely refreshing. The most food-friendly rosé on the list.",pairings:["Grilled fish","Charcuterie","Light salads","Local oysters"],story:"Tegernseerhof is run by Martin Mittelbach — the sixth generation of his family to farm these steep Wachau terraces, which means his family has been tending these vines since before the American Civil War. The estate is a member of Vinea Wachau, the association that administers the region's strict Codex — a set of rules about farming, yields, and winemaking that goes significantly beyond what Austrian law requires. That same precision applied to Riesling and Grüner Veltliner is applied here to a simple, beautiful dry rosé from Zweigelt. It's the kind of wine that makes you realize how seriously Austrians take every bottle they make.",trivia:["Zweigelt is Austria's most planted red grape — a cross of Blaufränkisch and St. Laurent created by Fritz Zweigelt at the Klosterneuburg institute in 1922.","The Vinea Wachau Codex is a voluntary but rigorous set of standards that member estates commit to — it prohibits chapitalization (adding sugar to boost alcohol), limits yields, and requires estate-grown fruit. It's one of the strictest self-regulatory codes in European wine.","The Wachau is better known for white wine, but Zweigelt rosé is a regional tradition — the grape's natural acidity and red fruit character translate beautifully into the style."]}
];

const CATS = ["All","Champagne","Other Bubbles","Grüner Veltliner","Riesling","Sauvignon Blanc","Chardonnay","Natural & Orange","Rosé","Pinot Noir","Cabernet","Austrian Reds","Virginia Wines"];
const ICONS = ["⚖️","☁️","💪","🍋","🧂","🌸","🌿","🪵","🍞","🧈","🍊","🍑","🍒"];
const ICON_LABELS = {"⚖️":"Medium","☁️":"Light","💪":"Full","🍋":"Acidic","🧂":"Mineral","🌸":"Floral","🌿":"Herbal","🪵":"Oak","🍞":"Toasty","🧈":"Creamy","🍊":"Natural","🍑":"Fruit-forward","🍒":"Red fruit"};
const PRICE_MAX = 900;
let activeCat = "All", activeIcons = new Set(), openId = null, priceMin = 0, priceMax = PRICE_MAX, activePreset = null;

function buildFilters() {
  document.getElementById('cat-filters').innerHTML = CATS.map(c =>
    `<button class="filter-btn${activeCat===c?' active':''}" onclick="setCat('${c}')">${c}</button>`).join('');
  document.getElementById('icon-filters').innerHTML = ICONS.map(ic =>
    `<button class="icon-btn${activeIcons.has(ic)?' active':''}" onclick="toggleIcon('${ic}')">${ic} ${ICON_LABELS[ic]}</button>`).join('');
  updateSliderUI(); buildSummary();
}

function setCat(c) { activeCat=c; openId=null; buildFilters(); render(); }
function toggleIcon(ic) { activeIcons.has(ic)?activeIcons.delete(ic):activeIcons.add(ic); buildFilters(); render(); }

function setPreset(btn) {
  const min=parseInt(btn.dataset.min), max=parseInt(btn.dataset.max);
  if (activePreset===btn) { activePreset=null; priceMin=0; priceMax=PRICE_MAX; document.getElementById('range-min').value=0; document.getElementById('range-max').value=PRICE_MAX; }
  else { activePreset=btn; priceMin=min; priceMax=max; document.getElementById('range-min').value=Math.min(min,PRICE_MAX); document.getElementById('range-max').value=Math.min(max,PRICE_MAX); }
  document.querySelectorAll('.preset-btn').forEach(b=>b.classList.toggle('active',b===activePreset));
  updateSliderUI(); buildSummary(); render();
}

function onSlider() {
  let minVal=parseInt(document.getElementById('range-min').value), maxVal=parseInt(document.getElementById('range-max').value);
  if(minVal>maxVal-10){minVal=maxVal-10; document.getElementById('range-min').value=minVal;}
  priceMin=minVal; priceMax=maxVal; activePreset=null;
  document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active'));
  updateSliderUI(); buildSummary(); render();
}

function updateSliderUI() {
  const minPct=(priceMin/PRICE_MAX)*100, maxPct=(priceMax/PRICE_MAX)*100;
  document.getElementById('slider-fill').style.left=minPct+'%';
  document.getElementById('slider-fill').style.width=(maxPct-minPct)+'%';
  const isDefault=priceMin===0&&priceMax===PRICE_MAX;
  document.getElementById('price-display').textContent=isDefault?'All prices':priceMax>=PRICE_MAX?`$${priceMin}+`:`$${priceMin} — $${priceMax}`;
}

function buildSummary() {
  const tags=[];
  if(activeCat!=='All') tags.push({label:activeCat,clear:()=>{activeCat='All';buildFilters();render();}});
  activeIcons.forEach(ic=>tags.push({label:`${ic} ${ICON_LABELS[ic]}`,clear:()=>{activeIcons.delete(ic);buildFilters();render();}}));
  const isPriceActive=priceMin>0||priceMax<PRICE_MAX;
  if(isPriceActive){const pl=priceMax>=PRICE_MAX?`$${priceMin}+`:`$${priceMin}–$${priceMax}`;tags.push({label:pl,clear:()=>{priceMin=0;priceMax=PRICE_MAX;activePreset=null;document.getElementById('range-min').value=0;document.getElementById('range-max').value=PRICE_MAX;document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active'));updateSliderUI();buildSummary();render();}});}
  const s=document.getElementById('active-summary');
  if(!tags.length){s.innerHTML='';return;}
  s.innerHTML=tags.map(t=>`<span class="active-tag">${t.label}<button onclick="(${t.clear.toString()})()">✕</button></span>`).join('')+`<button class="clear-all" onclick="clearAll()">Clear all</button>`;
}

function clearAll(){activeCat='All';activeIcons.clear();priceMin=0;priceMax=PRICE_MAX;activePreset=null;openId=null;document.getElementById('range-min').value=0;document.getElementById('range-max').value=PRICE_MAX;document.getElementById('search').value='';document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active'));buildFilters();render();}

function render() {
  const q=document.getElementById('search').value.toLowerCase();
  const filtered=WINES.filter(w=>{
    if(activeCat!=='All'&&w.cat!==activeCat)return false;
    if(activeIcons.size>0){for(const ic of activeIcons){if(!w.icons.includes(ic))return false;}}
    if(w.price<priceMin||(priceMax<PRICE_MAX&&w.price>priceMax))return false;
    if(q){const blob=[w.producer,w.name,w.cat,w.region,w.notes.join(' '),w.tableside,w.story,(w.trivia||[]).join(' ')].join(' ').toLowerCase();if(!blob.includes(q))return false;}
    return true;
  });
  document.getElementById('result-count').textContent=filtered.length===WINES.length?`${WINES.length} wines`:`${filtered.length} of ${WINES.length} wines`;
  const list=document.getElementById('wine-list');
  if(!filtered.length){list.innerHTML=`<div class="empty">No wines match your selection.</div>`;return;}
  const grouped={};
  filtered.forEach(w=>{if(!grouped[w.cat])grouped[w.cat]=[];grouped[w.cat].push(w);});
  let html='';
  for(const[cat,wines]of Object.entries(grouped)){
    html+=`<div class="section-head"><span class="section-name">${cat}</span>${SECTION_INTROS[cat]?`<div class="section-intro">${SECTION_INTROS[cat]}</div>`:''}</div>`;
    wines.forEach(w=>{
      const isOpen=openId===w.id;
      const dc=w.type==='red'?'#8b2020':w.cat==='Champagne'||w.cat==='Other Bubbles'?'#5a8fa8':w.cat==='Rosé'?'#b85a7a':w.cat==='Natural & Orange'?'#5a8a5a':'#c9a96e';
      html+=`<div class="wine-card${isOpen?' open':''}" id="card-${w.id}" onclick="toggleCard('${w.id}')">
        <div class="wine-card-top">
          <div class="wine-dot" style="background:${dc}"></div>
          <div class="wine-main">
            <div class="wine-number">${w.id} · ${w.vintage} · ${w.abv}</div>
            <div class="wine-producer">${w.producer}</div>
            <div class="wine-name-line">${w.name}</div>
            <div class="wine-name-line" style="font-size:11px;margin-top:1px;">${w.region}</div>
            <div class="wine-icons">${w.icons.map(i=>`<span class="wine-icon-badge">${i}</span>`).join('')}${w.cert?`<span class="cert-badge">${w.cert==='Co/b'?'Organic/Bio':w.cert==='CS'?'Sustainable':'Practicing'}</span>`:''}</div>
          </div>
          <div class="wine-right"><div class="wine-price">$${w.price}</div><div class="chevron">▾</div></div>
        </div>
        ${isOpen?`<div class="wine-expand">
          <div class="tableside-line">${w.tableside}</div>
          <div class="detail-grid">
            <div class="detail-block full"><div class="detail-label">Tasting Notes</div><div class="note-pills">${w.notes.map(n=>`<span class="note-pill">${n}</span>`).join('')}</div></div>
            <div class="detail-block full"><div class="detail-label">Food Pairings</div><div class="pairing-tags">${w.pairings.map(p=>`<span class="pairing-tag">${p}</span>`).join('')}</div></div>
          </div>
          <div class="expand-section"><div class="expand-section-title" onclick="toggleSec(event,'${w.id}-story')">The Story <span id="arr-${w.id}-story">▾</span></div><div class="expand-section-body" id="sec-${w.id}-story"><p>${w.story}</p></div></div>
          <div class="expand-section"><div class="expand-section-title" onclick="toggleSec(event,'${w.id}-trivia')">Trivia & Context <span id="arr-${w.id}-trivia">▾</span></div><div class="expand-section-body" id="sec-${w.id}-trivia">${(w.trivia||[]).map(t=>`<div class="trivia-item"><span class="trivia-bullet">◆</span><span>${t}</span></div>`).join('')}</div></div>
        </div>`:''}
      </div>`;
    });
  }
  list.innerHTML=html;
}

function toggleCard(id){openId=openId===id?null:id;render();if(openId)setTimeout(()=>{const el=document.getElementById('card-'+id);if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'});},50);}
function toggleSec(e,secId){e.stopPropagation();const sec=document.getElementById('sec-'+secId),arr=document.getElementById('arr-'+secId);if(!sec)return;const hidden=sec.style.display==='none';sec.style.display=hidden?'':'none';if(arr)arr.textContent=hidden?'▾':'▸';}

buildFilters(); render();
</script>
</body>
</html>
