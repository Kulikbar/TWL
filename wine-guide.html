<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wine Guide</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0e0c0a; --bg2: #161310; --bg3: #1e1a16; --card: #1a1612;
    --gold: #c9a96e; --gold2: #e8c98a; --gold-dim: #8a6e42;
    --cream: #f0e8d8; --muted: #8a7e6e; --border: rgba(201,169,110,0.15);
    --border2: rgba(201,169,110,0.3);
  }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--cream); font-family: 'Outfit', sans-serif; font-weight: 300; min-height: 100vh; -webkit-font-smoothing: antialiased; }
  .site-header { padding: 3rem 1.5rem 2rem; text-align: center; border-bottom: 1px solid var(--border); position: relative; overflow: hidden; }
  .site-header::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 0%, rgba(201,169,110,0.06) 0%, transparent 70%); pointer-events: none; }
  .header-eyebrow { font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold-dim); font-weight: 400; margin-bottom: 0.75rem; }
  .header-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(2rem, 8vw, 3.2rem); font-weight: 300; color: var(--cream); line-height: 1; letter-spacing: 0.02em; margin-bottom: 0.3rem; }
  .header-subtitle { font-family: 'Cormorant Garamond', serif; font-size: 1rem; color: var(--gold-dim); font-style: italic; }
  .controls { padding: 1rem 1.25rem 0.75rem; position: sticky; top: 0; z-index: 100; background: var(--bg); border-bottom: 1px solid var(--border); }
  .search-wrap { position: relative; margin-bottom: 0.75rem; }
  .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--gold-dim); font-size: 14px; pointer-events: none; }
  #search { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px 10px 38px; color: var(--cream); font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 300; outline: none; transition: border-color 0.2s; }
  #search::placeholder { color: var(--muted); }
  #search:focus { border-color: var(--gold-dim); }
  .filter-row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; margin-bottom: 6px; }
  .filter-row::-webkit-scrollbar { display: none; }
  .filter-btn { flex-shrink: 0; padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-family: 'Outfit', sans-serif; font-size: 12px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .filter-btn:hover { border-color: var(--gold-dim); color: var(--gold); }
  .filter-btn.active { background: var(--gold); border-color: var(--gold); color: var(--bg); }
  .icon-btn { flex-shrink: 0; padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 12px; cursor: pointer; transition: all 0.15s; white-space: nowrap; font-family: 'Outfit', sans-serif; }
  .icon-btn:hover { border-color: var(--gold-dim); }
  .icon-btn.active { background: var(--bg3); border-color: var(--gold); color: var(--cream); }
  .price-section { margin-top: 2px; }
  .price-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .price-label { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold-dim); }
  .price-display { font-family: 'Cormorant Garamond', serif; font-size: 15px; color: var(--gold); }
  .price-presets { display: flex; gap: 5px; margin-bottom: 8px; }
  .preset-btn { flex: 1; padding: 5px 4px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-family: 'Outfit', sans-serif; font-size: 11px; cursor: pointer; transition: all 0.15s; text-align: center; white-space: nowrap; }
  .preset-btn:hover { border-color: var(--gold-dim); color: var(--gold); }
  .preset-btn.active { background: rgba(201,169,110,0.12); border-color: var(--gold); color: var(--gold2); }
  .slider-track-wrap { position: relative; height: 28px; display: flex; align-items: center; padding: 0 2px; }
  .slider-track { position: absolute; left: 2px; right: 2px; height: 3px; background: var(--bg3); border-radius: 2px; border: 1px solid var(--border); }
  .slider-fill { position: absolute; height: 3px; background: var(--gold-dim); border-radius: 2px; pointer-events: none; }
  .range-input { position: absolute; width: 100%; -webkit-appearance: none; appearance: none; height: 3px; background: transparent; outline: none; pointer-events: none; left: 0; }
  .range-input::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--gold); border: 2px solid var(--bg); cursor: pointer; pointer-events: all; box-shadow: 0 0 0 1px var(--gold-dim); }
  .range-input::-webkit-slider-thumb:hover { background: var(--gold2); }
  #range-min { z-index: 3; } #range-max { z-index: 4; }
  .active-summary { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 6px 0 0; }
  .active-tag { display: flex; align-items: center; gap: 4px; font-size: 11px; padding: 3px 8px; border-radius: 12px; background: rgba(201,169,110,0.1); border: 1px solid var(--border2); color: var(--gold); }
  .active-tag button { background: none; border: none; color: var(--gold-dim); cursor: pointer; font-size: 11px; padding: 0; line-height: 1; margin-left: 2px; }
  .clear-all { font-size: 11px; color: var(--muted); background: none; border: none; cursor: pointer; padding: 3px 6px; font-family: 'Outfit', sans-serif; text-decoration: underline; text-underline-offset: 2px; }
  .legend { margin: 0.75rem 1.25rem 0; padding: 10px 14px; background: var(--bg3); border-radius: 8px; border: 1px solid var(--border); }
  .legend-title { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold-dim); margin-bottom: 6px; }
  .legend-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 12px; }
  .legend-item { font-size: 11px; color: var(--muted); }
  .result-count { font-size: 11px; color: var(--muted); padding: 0.6rem 1.25rem 0; font-style: italic; font-family: 'Cormorant Garamond', serif; }
  .wine-list { padding: 0 1rem 5rem; }
  .empty { text-align: center; padding: 4rem 2rem; font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; font-style: italic; color: var(--gold-dim); }
  .section-head { padding: 1.75rem 1.25rem 0.4rem; }
  .section-name { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 400; color: var(--gold); display: block; margin-bottom: 0.3rem; }
  .section-intro { font-size: 13px; color: var(--muted); line-height: 1.6; font-family: 'Cormorant Garamond', serif; font-style: italic; }
  .wine-card { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; background: var(--card); overflow: hidden; cursor: pointer; transition: border-color 0.2s; }
  .wine-card:hover { border-color: var(--border2); }
  .wine-card.open { border-color: var(--gold-dim); }
  .wine-card-top { display: flex; align-items: flex-start; padding: 14px 16px; gap: 12px; }
  .wine-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 7px; }
  .wine-main { flex: 1; min-width: 0; }
  .wine-number { font-size: 10px; letter-spacing: 0.12em; color: var(--gold-dim); margin-bottom: 2px; }
  .wine-producer { font-family: 'Cormorant Garamond', serif; font-size: 17px; font-weight: 500; color: var(--cream); line-height: 1.2; }
  .wine-name-line { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
  .wine-icons { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 6px; align-items: center; }
  .wine-icon-badge { font-size: 14px; line-height: 1; }
  .cert-badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; background: rgba(90,138,90,0.15); border: 1px solid rgba(90,138,90,0.3); color: #7ab87a; margin-left: 2px; }
  .wine-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
  .wine-price { font-family: 'Cormorant Garamond', serif; font-size: 18px; color: var(--gold); }
  .chevron { color: var(--gold-dim); font-size: 12px; transition: transform 0.25s; }
  .wine-card.open .chevron { transform: rotate(180deg); }
  .wine-expand { display: none; padding: 0 16px 16px; border-top: 1px solid var(--border); animation: fadeIn 0.2s ease; }
  .wine-card.open .wine-expand { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .tableside-line { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-style: italic; font-weight: 300; color: var(--gold2); line-height: 1.5; padding: 14px 0 12px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 4px; }
  .detail-block.full { grid-column: 1 / -1; }
  .detail-label { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold-dim); margin-bottom: 5px; }
  .note-pills { display: flex; flex-wrap: wrap; gap: 5px; }
  .note-pill { font-size: 11px; padding: 3px 10px; border-radius: 20px; border: 1px solid var(--border2); color: var(--gold); background: rgba(201,169,110,0.05); }
  .pairing-tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .pairing-tag { font-size: 11px; padding: 3px 10px; border-radius: 6px; background: var(--bg3); color: var(--muted); border: 1px solid var(--border); }
  .expand-section { border-top: 1px solid var(--border); padding-top: 12px; margin-top: 12px; }
  .expand-section-title { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold-dim); margin-bottom: 8px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; user-select: none; }
  .expand-section-body { font-size: 13px; color: var(--muted); line-height: 1.7; }
  .expand-section-body p { margin-bottom: 8px; }
  .expand-section-body p:last-child { margin-bottom: 0; }
  .trivia-item { display: flex; gap: 10px; margin-bottom: 8px; font-size: 13px; color: var(--muted); line-height: 1.6; }
  .trivia-bullet { color: var(--gold-dim); flex-shrink: 0; }
</style>
</head>
<body>
<header class="site-header">
  <div class="header-eyebrow">Staff Reference</div>
  <div class="header-title">The Wine List</div>
  <div class="header-subtitle">Fine Dining Wine Guide</div>
</header>

<div class="controls">
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input id="search" type="text" placeholder="Search producer, grape, region, descriptor…" oninput="render()">
  </div>
  <div class="filter-row" id="cat-filters"></div>
  <div class="filter-row" id="icon-filters"></div>
  <div class="price-section">
    <div class="price-header">
      <span class="price-label">Price Range</span>
      <span class="price-display" id="price-display">All prices</span>
    </div>
    <div class="price-presets">
      <button class="preset-btn" data-min="0" data-max="100" onclick="setPreset(this)">Under $100</button>
      <button class="preset-btn" data-min="100" data-max="150" onclick="setPreset(this)">$100–150</button>
      <button class="preset-btn" data-min="150" data-max="200" onclick="setPreset(this)">$150–200</button>
      <button class="preset-btn" data-min="200" data-max="9999" onclick="setPreset(this)">$200+</button>
    </div>
    <div class="slider-track-wrap">
      <div class="slider-track"></div>
      <div class="slider-fill" id="slider-fill"></div>
      <input type="range" class="range-input" id="range-min" min="0" max="900" step="10" value="0" oninput="onSlider()">
      <input type="range" class="range-input" id="range-max" min="0" max="900" step="10" value="900" oninput="onSlider()">
    </div>
  </div>
  <div class="active-summary" id="active-summary"></div>
</div>

<div class="legend">
  <div class="legend-title">Icon Key</div>
  <div class="legend-grid">
    <div class="legend-item">☁️ Light-bodied</div><div class="legend-item">⚖️ Medium-bodied</div>
    <div class="legend-item">💪 Full-bodied</div><div class="legend-item">🍋 High acidity</div>
    <div class="legend-item">🧂 Mineral</div><div class="legend-item">🌸 Floral</div>
    <div class="legend-item">🌿 Herbal / savory</div><div class="legend-item">🪵 Oak</div>
    <div class="legend-item">🍞 Toasty / lees</div><div class="legend-item">🧈 Creamy / buttery</div>
    <div class="legend-item">🍊 Natural / orange</div><div class="legend-item">🏺 Large format</div>
    <div class="legend-item">🍑 Fruit-forward</div><div class="legend-item">🍒 Red fruit forward</div>
  </div>
</div>

<div class="result-count" id="result-count"></div>
<div class="wine-list" id="wine-list"></div>

<script>
const SECTION_INTROS = {
  "Champagne": "The real thing. Every bottle in this section is from the Champagne appellation in northeastern France — the only place in the world legally permitted to call itself Champagne. Method, terroir, and house style vary enormously. Know the differences and you'll be able to steer any guest to exactly what they want.",
  "Other Bubbles": "Sparkling wine made everywhere else. Austria, Italy, Oregon, Virginia, Brazil — each with its own grape, method, and personality. These aren't consolation prizes for guests who can't afford Champagne. Several are extraordinary on their own terms and worth championing.",
  "Grüner Veltliner": "Austria's signature grape. Think Sauvignon Blanc's precision crossed with Chardonnay's weight — but drier, more savory, and with a white pepper kick that's entirely its own. This is the wine Austria built its reputation on, and our list goes deep."
};

const WINES = [
  // ── CHAMPAGNE ──────────────────────────────────────────────
  {
    id:"209", cat:"Champagne", type:"sparkling",
    producer:"Beau Joie", name:"Brut, NV", region:"Champagne, France", vintage:"NV", abv:"12%", price:95, cert:"",
    icons:["⚖️","🍞","🌸","🍑"],
    notes:["White peach","Brioche","Honeysuckle","Toasted almond","Creamy mousse"],
    tableside:"Beau Joie comes in a copper-clad bottle that looks unlike anything else on the table — which is half the point. The wine inside is genuinely good: round, toasty, and approachable. A strong opening move for a celebratory table.",
    pairings:["Oysters on the half shell","Fried chicken","Brie","Light canapés"],
    story:"Beau Joie was created with presentation in mind — the hammered copper bottle is designed to stand out on an ice bucket or a table, and it works. But the wine isn't just packaging: it's a Pinot Noir-dominant blend from Grand Cru and Premier Cru vineyards with real richness and a satisfying creamy finish. For guests who want something that makes a visual statement without sacrificing quality, this is the answer.",
    trivia:["The copper bottle acts as an insulator, keeping the wine cooler for longer once out of the ice bucket — a genuine functional benefit, not just aesthetics.","Beau Joie sources fruit exclusively from Grand Cru and Premier Cru villages, which represents the top tier of Champagne's village classification system.","The name translates loosely to 'beautiful joy' — it was conceived explicitly as a celebration wine."]
  },
  {
    id:"200", cat:"Champagne", type:"sparkling",
    producer:"Beau Joie", name:"Brut Nature, NV", region:"Champagne, France", vintage:"NV", abv:"12%", price:180, cert:"",
    icons:["⚖️","🍋","🧂"],
    notes:["Green apple","Lemon curd","Chalk","Flint","Bone dry finish"],
    tableside:"Zero dosage — no sugar added after disgorgement, none. This is Champagne in its most naked form: pure fruit, pure mineral, pure acidity. For guests who find most Champagne too sweet or too soft, this is the answer.",
    pairings:["Oysters","Sea urchin","Ceviche","Sashimi"],
    story:"Most Champagne receives a small addition of sugar dissolved in wine — called dosage — right before the final cork goes in. It softens edges, rounds out acidity, and makes the wine more immediately approachable. Brut Nature skips that entirely. What you get is the wine as it actually is: unvarnished, high-acid, and mineral-driven. It's not for everyone, but for the guest who knows exactly what they want, it's a statement.",
    trivia:["'Brut Nature,' 'Zero Dosage,' and 'Non-Dosé' all mean the same thing — no sugar added. The term 'Brut' on its own actually allows up to 12 grams of sugar per liter.","Without dosage to soften it, zero-dosage Champagne requires higher quality base wine — there's nowhere to hide.","The trend toward lower and zero dosage Champagnes has accelerated significantly since the 2010s as palates have moved toward drier, more mineral styles."]
  },
  {
    id:"215", cat:"Champagne", type:"sparkling",
    producer:"Billecart-Salmon", name:"Extra Brut, 2013", region:"Champagne, France", vintage:"2013", abv:"12%", price:301, cert:"",
    icons:["💪","🍞","🧂"],
    notes:["Hazelnut","Baked apple","Preserved lemon","White truffle","Toasted brioche","Lingering mineral finish"],
    tableside:"A vintage Champagne from one of the great houses — meaning every grape in this bottle came from a single exceptional year, 2013, rather than a blend of multiple harvests. A decade of aging has done extraordinary things to it. This is a special occasion bottle.",
    pairings:["Lobster","Pan-seared scallops","Aged Comté","Black truffle preparations"],
    story:"Billecart-Salmon is a family-owned house in Mareuil-sur-Aÿ that has operated continuously since 1818 — through wars, phylloxera, the Great Depression, and every other catastrophe the 20th century threw at Champagne. Their house style is precision: lower dosage than most houses, longer aging on the lees, and a commitment to freshness over opulence. The 2013 vintage was challenging — a cold, late season — but produced wines of remarkable tension that have aged beautifully.",
    trivia:["Billecart-Salmon has remained family-owned and operated for over 200 years — extraordinarily rare among Champagne houses, most of which are now owned by luxury conglomerates.","Vintage Champagne must be aged on the lees for a minimum of 3 years; prestige cuvées are often aged 8–10 years or more before release. This one has had over a decade.","The 2013 harvest in Champagne was one of the latest on record — grapes weren't picked until mid-October in many villages, producing wines with exceptional natural acidity."]
  },
  {
    id:"203", cat:"Champagne", type:"sparkling",
    producer:"Billecart-Salmon", name:"'N°2' Extra Brut, NV", region:"Champagne, France", vintage:"NV", abv:"12%", price:260, cert:"",
    icons:["⚖️","🍋","🧂","🍞"],
    notes:["Brioche","Green apple","Grapefruit pith","Chalk","Clean dry finish"],
    tableside:"Billecart's serious non-vintage expression — bone-dry, mineral, and built around Chardonnay. More restrained than most NV Champagne, more cerebral. For the guest who finds standard Brut a bit too easy.",
    pairings:["Oysters","Poached turbot","Caviar","Mild soft cheeses"],
    story:"The 'N°2' designation signals this is their elevated non-vintage offering, sitting above the standard Brut in both price and intent. Chardonnay-dominant with extended lees aging, it's made in the same precision-first philosophy as everything Billecart produces. The extra brut designation means dosage is kept very low — this is a wine that asks something of the drinker rather than meeting them halfway.",
    trivia:["Chardonnay-dominant Champagnes tend to be leaner and more mineral in their youth, developing richness with age — the opposite of Pinot Noir-dominant blends, which are rounder upfront.","The 'N°2' name is an internal house designation that positions it clearly in the Billecart lineup without needing to explain the classification system to guests.","Extra Brut allows 0–6 grams of sugar per liter; Brut allows up to 12. The difference is noticeable side by side."]
  },
  {
    id:"221", cat:"Champagne", type:"sparkling",
    producer:"Billecart-Salmon", name:"Rendez-Vous CINQ, Pinot Noir Extra Brut, NV", region:"Champagne, France", vintage:"NV", abv:"12%", price:173, cert:"",
    icons:["⚖️","🌸","🍞"],
    notes:["Wild strawberry","Rose petal","Cherry","Brioche","Soft spice"],
    tableside:"A Pinot Noir-dominant blanc de noirs — red grapes vinified white, which gives it a delicate pink tinge and a red fruit character you don't find in Chardonnay-based Champagne. Elegant, perfumed, and slightly unexpected.",
    pairings:["Salmon","Duck breast","Strawberry desserts","Charcuterie"],
    story:"Blanc de noirs — 'white wine from black grapes' — is one of Champagne's most interesting styles. The juice of Pinot Noir and Pinot Meunier is naturally colorless; the color in red wine comes from extended skin contact. By pressing quickly and gently, you get a white wine with all of the aromatic complexity of a red grape variety. The result is something rounder and more fragrant than a Chardonnay-based Champagne, with a faint salmon blush and a fruit-forward character.",
    trivia:["Blanc de noirs is one of the rarer styles in Champagne — most houses blend Chardonnay and Pinot Noir together rather than making them separately.","The 'Rendez-Vous' series from Billecart is designed to highlight individual grape variety expression rather than house blending philosophy.","Pinot Noir grown in Champagne is the same grape as red Burgundy — but the climate, winemaking, and sparkling process transform it into something completely unrecognizable."]
  },
  {
    id:"226", cat:"Champagne", type:"sparkling",
    producer:"Billecart-Salmon", name:"Rendez-Vous No.4, Chardonnay Extra Brut, NV", region:"Champagne, France", vintage:"NV", abv:"12%", price:173, cert:"",
    icons:["☁️","🍋","🧂","🌸"],
    notes:["Lemon verbena","White flower","Green apple","Chalk","Precise dry finish"],
    tableside:"Blanc de blancs — 100% Chardonnay — at its most focused. Lean, electric, and mineral. If a guest wants to understand what Chardonnay tastes like before oak and butter get involved, this is a great place to start.",
    pairings:["Oysters","Clams casino","Grilled sole","Goat cheese"],
    story:"The companion piece to the CINQ — same series, same extra brut dosage, different grape. Where the Pinot Noir version is round and fragrant, this is all tension and precision. Blanc de blancs Champagne made from Côte des Blancs Chardonnay is about as pure an expression of that grape as exists anywhere in the world — no oak, no malolactic softening, just the fruit and the chalk it grew in.",
    trivia:["The Côte des Blancs — the 'slope of whites' — is a ridge south of Épernay planted almost exclusively with Chardonnay. It's considered the spiritual home of blanc de blancs Champagne.","Champagne is the world's northernmost major wine region — the marginal climate means grapes rarely over-ripen, which is why the acidity is so pronounced.","Blanc de blancs ages exceptionally well — bottles from great years can evolve for 20–30 years, developing complexity while retaining freshness."]
  },
  {
    id:"205", cat:"Champagne", type:"sparkling",
    producer:"Delamotte", name:"Blanc de Blancs, NV", region:"Champagne, France", vintage:"NV", abv:"12%", price:224, cert:"",
    icons:["☁️","🍋","🧂","🌸"],
    notes:["Lemon curd","Oyster shell","White flower","Toasted almond","Chalky mineral finish"],
    tableside:"Delamotte is the sister house to Salon — the most coveted blanc de blancs in all of Champagne — and they share the same vineyards in Le Mesnil-sur-Oger. In years when Salon isn't declared, that fruit goes into Delamotte. This is extraordinary Champagne at a fraction of what Salon costs.",
    pairings:["Fine oysters","Sea urchin","Turbot","Lobster with light butter sauce"],
    story:"Le Mesnil-sur-Oger is a Grand Cru village on the Côte des Blancs that many consider the single greatest source of Chardonnay in Champagne. The chalk here is unusually deep and pure, giving wines a minerality and tension that's almost startling. Salon, Delamotte's famous sibling, has only been produced in 37 vintages since it was first made in 1905 — the rest of the time, that fruit becomes this. For guests who know their Champagne, mention the Salon connection. It lands every time.",
    trivia:["Salon is the only Champagne house that produces a single wine, from a single vineyard, in a single vintage. It's declared fewer than once every two years on average.","Delamotte and Salon have been under the same ownership since 1988 when Laurent-Perrier acquired both houses together.","Le Mesnil-sur-Oger's chalk soils are estimated to be over 70 million years old — remnants of an ancient seabed. The fossilized marine shells in the chalk are part of what gives the wine its distinctive mineral character."]
  },
  {
    id:"217", cat:"Champagne", type:"sparkling",

    tableside:"Krug makes one wine — this one — and they've been perfecting it since 1843. The Grand Cuvée is a blend of up to 120 different wines from as many as 10 different vintages, assembled to express the house's idea of what Champagne should taste like. The 172nd Edition means it's the 172nd time they've made it. Nothing else tastes like this.",

    pairings:["Local oysters","Crab cakes","Light starters","Virginia country ham"],
    story:"Rappahannock Cellars is in Huntly, Virginia, about 65 miles from our restaurant. They've been making traditional-method sparkling wine since the early 2000s, when Virginia sparkling was almost unheard of. The Prestige is their flagship — Chardonnay grown on the estate, secondary fermentation in bottle, disgorgement by hand. It's not trying to be Champagne; it's trying to be Virginia, and it succeeds.",

  {

    icons:["⚖️","🍞","🧂","🌸"],
    notes:["Toasted brioche","Green apple","Citrus blossom","Fine persistent mousse","Clean mineral finish"],
    tableside:"Franciacorta is Italy's most serious sparkling appellation — traditional method, minimum 18 months on the lees, strict production rules. Barone Pizzini is one of the region's top organic producers. Think of it as Italian Champagne made with Italian grapes and Italian discipline.",
    pairings:["Risotto","White fish","Soft Italian cheeses","Seafood pasta"],

    trivia:["Franciacorta received DOCG status in 1995 — Italy's highest wine classification — making it the only Italian sparkling wine to achieve this designation.","The name 'Animante' means 'giving life' or 'animating' in Italian — a reference to the secondary fermentation that creates the bubbles.","Barone Pizzini has been certified organic since 1995 — among the earliest organic certifications in Franciacorta and one of the oldest in Italian wine production."]

    notes:["White peach","Pear","Acacia blossom","Light citrus","Fresh clean finish"],

    pairings:["Charcuterie","Salumi","Emilian pasta","Pizza","Aged Parmigiano"],

    trivia:["Emilia-Romagna produces some of Italy's richest food — Parmigiano-Reggiano, Prosciutto di Parma, Mortadella, and tagliatelle al ragù all come from this region. Dry Lambrusco evolved specifically as a foil to this food culture.","The 'Lambrusco' name refers not to one grape but to a family of native Emilian grapes — Lambrusco Grasparossa, Sorbara, and Salamino being the main varieties. Chiarli uses traditional local clones.","Cleto Chiarli was founded in 1860 and is one of the oldest continuously operating Lambrusco producers in existence."]

    notes:["Green apple","Lime zest","Crushed limestone","White pepper","Dried herbs"],
    tableside:"The entry point to serious Austrian Grüner — a single vineyard, high-elevation Kamptal white with snappy acidity, a stony mineral thread, and that signature white pepper finish. Clean, precise, built for food.",
